app-id: io.github.rulin132.ChatGPT
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: chatgpt-launcher
separate-locales: false
tags:
  - proprietary

# ---------------------------------------------------------------------------
# SEALED SANDBOX (default posture, see docs/SECURITY.md)
#
# Deliberately absent:
#   --filesystem=host                     the app sees NO user files by default
#   --talk-name=org.freedesktop.Flatpak   no flatpak-spawn --host = no host escape
#
# Grant a workspace explicitly, per-user, per-directory:
#   flatpak override --user --filesystem=~/code io.github.rulin132.ChatGPT
# ---------------------------------------------------------------------------
finish-args:
  # zypak's spawn strategy needs expose-pids/SpawnStarted (flatpak >= 1.8.2).
  - --require-version=1.8.2
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Credential storage via Secret Service / KWallet.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # Tray icon (StatusNotifierItem only; GNOME additionally needs a shell ext).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Chromium owns this exact name for its tray item (sandbox pid is always 2).
  # Without it the proxy denies RequestName and the icon silently never shows.
  - --own-name=org.freedesktop.StatusNotifierItem-2-1
  # Notifications go through the portal, no talk-name needed since BaseApp 23.08.
  #
  # The app hardcodes ~/.codex and ~/.cache, ignoring XDG_CACHE_HOME, and
  # re-downloads its Codex runtime (~67s) on every start without these, because
  # $HOME is a throwaway tmpfs. --persist does NOT widen the sandbox: it binds
  # subdirectories of ~/.var/app/<id>/. No host path becomes visible.
  - --persist=.codex
  - --persist=.cache
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: chatgpt
    buildsystem: simple
    build-commands:
      # Install-time unpacker and launcher.
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 launcher.sh /app/bin/chatgpt-launcher
      - install -Dm755 codex-flatpak-wrapper
        /app/libexec/chatgpt-flatpak/codex-flatpak-wrapper
      - install -Dm755 patch-terminal-route.js
        /app/libexec/chatgpt-flatpak/patch-terminal-route.js
      # AppStream/desktop metadata MUST be installed at build time: the store
      # index has to exist before any extra-data is downloaded.
      - install -Dm644 io.github.rulin132.ChatGPT.desktop
        /app/share/applications/io.github.rulin132.ChatGPT.desktop
      - install -Dm644 io.github.rulin132.ChatGPT.metainfo.xml
        /app/share/metainfo/io.github.rulin132.ChatGPT.metainfo.xml
      - for s in 16 32 48 64 128 256 512; do install -Dm644 "icons/$s.png"
        "/app/share/icons/hicolor/${s}x${s}/apps/io.github.rulin132.ChatGPT.png"; done
    sources:
      - type: dir
        path: build-aux

      # -- Vendor payload -----------------------------------------------------
      # extra-data is downloaded on the USER'S machine at install time. We never
      # host or redistribute OpenAI's bytes. sha256 + size are MANDATORY and are
      # verified before apply_extra runs.
      #
      # Versioned pool/ URLs: the bytes behind a pin cannot change. When
      # upstream drops an old version from pool/, installs 404 until the
      # nightly re-pin (update-check.yml -> scripts/refresh-source.sh) lands.
      #
      # Run `make hashes` to populate these for the first time.
      - type: extra-data
        filename: chatgpt.deb
        only-arches:
          - x86_64
        url: https://persistent.oaistatic.com/codex-app-prod/linux/deb/pool/main/c/chatgpt/chatgpt_26.820.71523_amd64.deb
        sha256: 472d03e88a29857f1015b2b9175d80523a131cf1bc3e9017eb1a8ff234de1bda
        size: 404672994
        x-checker-data:
          type: debian-repo
          package-name: chatgpt
          root: https://persistent.oaistatic.com/codex-app-prod/linux/deb
          dist: stable
          component: main
          is-main-source: true

      - type: extra-data
        filename: chatgpt.deb
        only-arches:
          - aarch64
        url: https://persistent.oaistatic.com/codex-app-prod/linux/deb/pool/main/c/chatgpt/chatgpt_26.820.71523_arm64.deb
        sha256: e0ecaaaea6aa44e7e458c932f5cd7612e786c0aeb08bed971cb96ae3c4266013
        size: 381539074
        x-checker-data:
          type: debian-repo
          package-name: chatgpt
          root: https://persistent.oaistatic.com/codex-app-prod/linux/deb
          dist: stable
          component: main
