name: release

# Tag or manual dispatch ONLY. This previously fired on every push to main that
# touched the manifest or build-aux/, which is most packaging work: the first
# such merge would have published, permanently fixing the app id and remote URL
# for everyone who installed from it. Publishing is a deliberate act.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # GPG signing is not optional: flatpak refuses system-wide installs of
      # extra-data apps from a source that is not gpg-verified.
      - name: import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME=$PWD/.gnupg
          mkdir -p -m700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: build + sign repo
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --disable-rofiles-fuse --disable-updates \
            --gpg-sign="$GPG_KEY_ID" --repo=repo build io.github.rulin132.ChatGPT.yaml
          # Static deltas matter here: archive-z2 is one HTTP request per file,
          # which is brutal against Pages.
          flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" \
            --generate-static-deltas --prune repo/

      # No sideload bundle. `flatpak build-bundle` cannot carry an extra-data
      # source (flatpak#1334, open since 2018), so the .flatpak it produces has
      # no application payload and installs to "Extra data missing in detached
      # metadata". Shipping one would hand users a file that cannot work.

      - name: assemble Pages site
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          PAGES_URL: https://OWNER.github.io/codex-flatpak
        run: ./scripts/publish-pages.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: read version
        id: ver
        run: echo "v=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' build-aux/io.github.rulin132.ChatGPT.metainfo.xml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: publish OCI image to GHCR
        run: |
          set -euo pipefail
          flatpak build-bundle --oci --oci-layer-compress=zstd \
            repo oci-image io.github.rulin132.ChatGPT
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          skopeo copy --format oci oci:oci-image \
            "docker://ghcr.io/${{ github.repository_owner }}/chatgpt-flatpak:${{ steps.ver.outputs.v }}"
          skopeo copy --format oci oci:oci-image \
            "docker://ghcr.io/${{ github.repository_owner }}/chatgpt-flatpak:latest"

      # No files: attached. The release is a marker pointing at the repo remote;
      # see the bundle note above for why there is nothing to upload.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          body: |
            Packaging build for upstream ChatGPT ${{ steps.ver.outputs.v }}.

            Install:
                flatpak remote-add --user chatgpt https://OWNER.github.io/codex-flatpak/chatgpt.flatpakrepo
                flatpak install --user chatgpt io.github.rulin132.ChatGPT

  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
