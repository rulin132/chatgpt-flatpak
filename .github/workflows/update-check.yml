name: update-check

# Upstream publishes to a rolling "latest" URL, so the bytes behind our pinned
# sha256 rotate without warning and every new install then fails on checksum.
#
# First-party on purpose. The previous version used three marketplace actions
# and never ran: its only execution failed at "Set up job" with "Repository
# access blocked" before any step of its own. scripts/refresh-source.sh already
# does the whole re-pin, so nothing here needs a third party.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # GitHub's recursion guard: nothing GITHUB_TOKEN does creates a workflow
      # run. A PR opened with it gets zero checks, so with AUTO_UPDATE on it
      # either waits forever on contexts that never report, or merges against
      # no CI at all. A PAT in AUTOMATION_TOKEN is what makes build.yml run on
      # the bot's PR. Checked before checkout so an unset secret is one clear
      # message and not a confusing clone failure.
      - name: require an automation token
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "AUTOMATION_TOKEN is not set." >&2
            echo "Add a repository secret holding a personal access token with" >&2
            echo "contents:write and pull-requests:write. GITHUB_TOKEN cannot be" >&2
            echo "used here: PRs it opens never trigger any workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: re-pin upstream
        run: |
          set -euo pipefail
          git config user.name  "update-bot"
          git config user.email "noreply@github.com"
          ./scripts/refresh-source.sh io.github.rulin132.ChatGPT.yaml

      - name: open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "upstream unchanged"
            exit 0
          fi
          ver=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' \
                build-aux/io.github.rulin132.ChatGPT.metainfo.xml | head -n1)
          git checkout -B chore/upstream-refresh
          git commit -am "Re-pin upstream $ver"
          git push -f origin chore/upstream-refresh
          existing=$(gh pr list --head chore/upstream-refresh --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for chore/upstream-refresh"
            exit 0
          fi
          gh pr create --head chore/upstream-refresh --base main \
            --title "Re-pin upstream $ver" --label automated \
            --body "Upstream rotated the bytes behind the rolling latest URL. sha256 and size are re-pinned for both architectures and the AppStream release entry updated from the .deb control file.

          Merging is not a rubber stamp. CI installs this payload for real on x86_64 and aarch64 and asserts it launches. If upstream moved app.asar or renamed the binary, those jobs fail and scripts/inspect-deb.sh says what changed."

      # GitHub disables scheduled workflows after 60 days of repository
      # inactivity. A bot that silently stops is worse than no bot, and a
      # commit is the only thing that counts as activity.
      #
      # The commit lands on chore/keepalive, not main. main has branch
      # protection with required checks, so a push there is rejected outright
      # and the keepalive would guarantee the very outcome it exists to stop.
      # A commit anywhere in the repository counts. Never force-pushed: the
      # branch is created from main once, then extended.
      - name: keep the schedule armed
        run: |
          set -euo pipefail
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct origin/main) ) / 86400 ))
          if [ "$age" -lt 50 ]; then
            echo "last commit was $age days ago, no keepalive needed"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin chore/keepalive >/dev/null 2>&1; then
            git fetch --depth=1 origin chore/keepalive
            git checkout -B chore/keepalive FETCH_HEAD
          else
            git checkout -B chore/keepalive origin/main
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-upstream-check
          git add .github/last-upstream-check
          git commit -m "Keep the scheduled upstream check armed"
          git push origin chore/keepalive

      # Gated on a repository variable so the pipeline can be stopped from the
      # GitHub UI in seconds, with no commit and nothing to revert. Unset means
      # off, so this ships disarmed.
      - name: auto-merge when the gate is green
        if: vars.AUTO_UPDATE == 'on'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          # Author and label as well as the branch name. On the branch alone,
          # anyone who can open a PR from a branch called chore/upstream-refresh
          # gets it auto-merged the moment checks pass, which walks straight
          # past the human merge gate. @me is the automation token's own user,
          # so this only ever matches a PR this workflow opened.
          num=$(gh pr list --head chore/upstream-refresh --state open \
            --author "@me" --label automated \
            --json number --jq '.[0].number // empty')
          [ -n "$num" ] || { echo "no open refresh PR"; exit 0; }
          gh pr merge "$num" --auto --squash
          echo "auto-merge armed on PR #$num; it lands when the required checks pass"
