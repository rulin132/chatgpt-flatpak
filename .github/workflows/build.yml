name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the checkout (shellcheck, lint,
# build, smoke test). None push, comment, or release, so the token needs no
# write scope.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not in the flatpak container: it ships neither dnf nor shellcheck.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Print the version: the runner's is older than a typical local one and
      # still flags SC2015, so green locally and red here look identical.
      - run: shellcheck --version && shellcheck -x scripts/*.sh tests/*.sh build-aux/apply_extra build-aux/launcher.sh
      # ostree for test-merge-repos.sh.
      - run: sudo apt-get update && sudo apt-get install -y ostree
      - run: for t in tests/test-*.sh; do echo "== $t"; "$t" || exit 1; done

  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      # The bare binary, NOT `flatpak run org.flatpak.Builder`: that form cannot
      # create .flatpak-builder in the runner workspace from inside the sandbox
      # and dies on Permission denied. `make lint` uses the flatpak form because
      # locally the checkout is under $HOME, which the sandbox can write.
      # --exceptions is required; --user-exceptions alone is silently inert.
      - name: manifest lint
        run: |
          flatpak-builder-lint --exceptions \
            --user-exceptions flatpak-builder-lint-exceptions.json \
            manifest io.github.rulin132.ChatGPT.yaml

  # No `needs:`. The smoke test is the only thing catching upstream layout
  # drift, and a style or naming problem must not be able to hide a broken
  # payload. Gating it on the linters is how it came to never run at all.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      # A repo, not a bundle: build-bundle cannot carry extra-data
      # (flatpak#1334), so its .flatpak has no payload. Extra-data is fetched at
      # install time, so only the smoke test touches persistent.oaistatic.com.
      - name: build
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --disable-rofiles-fuse --arch=${{ matrix.arch }} \
            --repo=repo build io.github.rulin132.ChatGPT.yaml

      # A real install is the only thing that exercises apply_extra, so assert
      # the payload arrived rather than trusting a zero exit. Runs on both
      # arches: the arm64 .deb is a separate pinned payload, so limiting this to
      # x86_64 would let an arm-only layout change stay green and get published.
      - name: smoke test (install + apply_extra)
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists --no-gpg-verify chatgpt-ci "$PWD/repo"
          flatpak install --user -y chatgpt-ci io.github.rulin132.ChatGPT
          scripts/ci-smoke.sh io.github.rulin132.ChatGPT
