name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          dnf install -y ShellCheck || true
          shellcheck -x scripts/*.sh build-aux/apply_extra build-aux/launcher.sh
      - name: manifest lint
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest io.github.OWNER.ChatGPT.yaml

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.OWNER.ChatGPT.flatpak
          manifest-path: io.github.OWNER.ChatGPT.yaml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          # The vendor payload is extra-data: it is fetched on the user's
          # machine at install time, so the build itself never touches
          # persistent.oaistatic.com. Only the smoke test below does.
          upload-artifact: true

      # Real install exercises apply_extra — the only place upstream layout
      # changes can bite. This is the check that catches a rotated .deb whose
      # internals moved, which a manifest lint cannot see.
      - name: smoke test (install + apply_extra)
        if: matrix.arch == 'x86_64'
        run: |
          flatpak install --user -y --bundle io.github.OWNER.ChatGPT.flatpak
          flatpak run --command=cat io.github.OWNER.ChatGPT /app/extra/VERSION
          flatpak run --command=sh io.github.OWNER.ChatGPT -c \
            'test -f /app/extra/app.env && . /app/extra/app.env && test -x "$APP_BIN"'
          echo "apply_extra produced a runnable payload"
