name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not in the flatpak container: it has neither dnf nor shellcheck, so the old
  # `dnf install -y ShellCheck || true` masked its own failure and the next line
  # died with "shellcheck: command not found". The ubuntu runner image ships
  # shellcheck. Runs the unit tests too, since they need nothing else.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Print the version: the runner's shellcheck is older than a typical local
      # one and still reports SC2015 for `A && B || C`, which newer releases do
      # not. Without this line a green local run and a red CI run look identical.
      - run: shellcheck --version
      - run: shellcheck -x scripts/*.sh tests/*.sh build-aux/apply_extra build-aux/launcher.sh
      - run: tests/test-sync-version.sh

  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: manifest lint
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest io.github.rulin132.ChatGPT.yaml

  # Deliberately does NOT depend on lint or shellcheck. The smoke test below is
  # the only thing that catches upstream layout drift before it reaches users,
  # and gating it on the linters would have meant it never ran at all: the
  # manifest lint currently fails on appid-url-not-reachable, which is tied to
  # an unresolved app-id decision, and the shellcheck job was failing outright.
  # A style or naming problem must not be able to hide a broken payload.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Built into a local OSTree repo, not a bundle: `flatpak build-bundle`
      # cannot carry an extra-data source (flatpak#1334), so a bundle has no
      # payload and cannot be installed. A repo remote reads the extra-data
      # source from commit metadata and works.
      #
      # The vendor payload is extra-data: it is fetched at install time, so the
      # build itself never touches persistent.oaistatic.com. Only the smoke
      # test below does.
      - name: build
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --disable-rofiles-fuse --arch=${{ matrix.arch }} \
            --repo=repo build io.github.rulin132.ChatGPT.yaml

      # Real install exercises apply_extra, the only place upstream layout
      # changes can bite. This is the check that catches a rotated .deb whose
      # internals moved, which a manifest lint cannot see. It is the only thing
      # standing between upstream layout drift and users, so it must actually
      # run: assert the payload arrived rather than trusting a zero exit.
      - name: smoke test (install + apply_extra)
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists --no-gpg-verify chatgpt-ci "$PWD/repo"
          flatpak install --user -y chatgpt-ci io.github.rulin132.ChatGPT

          version=$(flatpak run --command=cat io.github.rulin132.ChatGPT /app/extra/VERSION)
          echo "apply_extra reported upstream version: $version"
          test -n "$version" && test "$version" != unknown

          flatpak run --command=sh io.github.rulin132.ChatGPT -c '
            set -eu
            test -f /app/extra/app.env || { echo "no app.env"; exit 1; }
            . /app/extra/app.env
            test -x "$APP_BIN" || { echo "APP_BIN not executable: $APP_BIN"; exit 1; }
            head -c4 "$APP_BIN" | grep -q ELF || { echo "APP_BIN is not an ELF binary"; exit 1; }
            test -f /app/extra/app/resources/app.asar || { echo "no app.asar"; exit 1; }
            echo "payload OK: $APP_BIN"
          '
